[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpdb-3"
version = "3.8.0"
description = "Free Poker Database (FPDB-3) - Legacy Python Implementation"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "beautifulsoup4==4.12.3",
    "pandas>=2.2.2",
    "psutil>=5.9.0",
    "pyobjc==10.3.1; sys_platform == 'darwin'",
    # UIAutomation, the Windows half of reading a table's chairs off the client
    # window. Without it the Fast-Fold HUD can only learn who is at the table
    # from the client log, one player per action; see winamax_ax_seats.
    "comtypes>=1.4.1; sys_platform == 'win32'",
    "PySide6>=6.8.1",
    "colorlog==6.9.0",
    "pyzmq>=26.0.3",
    "qt-material==2.14",
    "numpy>=2.1.0",
    "pytz==2024.1",
    "aiohttp>=3.13.2",
    "cachetools==5.5.0",
    "xlrd==2.0.1",
    "playwright>=1.40.0",
    "pymysql>=1.1.0",
    "defusedxml>=0.7.1",
    "pyqtgraph>=0.13.0",
    # PostgreSQL is offered in the GUI's database chooser, so the driver has to
    # ship with the application. Left as an extra, a packaged build could only
    # ever open SQLite or MySQL.
    "psycopg[binary]>=3.1.0",
    "pypoker-eval @ git+https://github.com/jejellyroll-fr/poker-eval.git@v1.2.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.9.0",
    "wheel>=0.42.0",
    # PyInstaller converts the .jpg application icon to .ico for the Windows
    # executable, and needs Pillow to do it. Pillow used to arrive transitively
    # through matplotlib; dropping that dependency broke the Windows build, so
    # the build-time requirement is now declared where it belongs.
    "pillow>=10.0.0",
]
test = [
    "pytest>=8.3.2",
    "pytest-qt>=4.0.2",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "hypothesis>=6.100.0",
    "psycopg[binary]>=3.1.0",
    "PySide6>=6.8.1",
    "ruff>=0.12.8",
    "mypy>=1.11",
]
test-no-gui = [
    "pytest>=8.3.2",
    "pytest-qt>=4.0.2",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "hypothesis>=6.100.0",
    "psycopg[binary]>=3.1.0",
    "ruff>=0.12.8",
    "mypy>=1.11",
]
windows = ["pywin32==306", "configparser", "PySide6>=6.8.1", "comtypes>=1.4.1"]
linux = ["xcffib==1.5.0", "PySide6>=6.8.1"]
macos = ["PySide6>=6.8.1"]
postgresql = ["psycopg[binary]>=3.1.0"]
mysql = ["mysqlclient==2.2.4"]

[project.scripts]
fpdb_3_legacy = "fpdb_3_legacy.legacy_launcher:main"

[tool.ruff]
extend-include = ["*.pyw"]
extend-exclude = ["build", "archives"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# C901/PLR0912/PLR0915 cap how complex a function may get. They are enforced
# repo-wide; the modules that predate them are listed in per-file-ignores below.
select = ["C901", "E", "F", "I", "PLR0912", "PLR0915", "UP", "W"]
ignore = [
    "E401",
    # Legacy entry points intentionally initialize translations, mocks, or
    # sys.path before importing modules that depend on that state.
    "E402",
    # Regex, SQL, QSS, and generated display strings are frequently
    # indivisible; formatting code is still enforced independently.
    "E501",
    "E731",
    "E713",
    # UP017 rewrites `timezone.utc` to `datetime.UTC`, which requires 3.11.
    # requires-python says >=3.11, but the shipped binaries do not run on it:
    # PyOxidizer 0.24 cannot link CPython 3.11+ and embeds 3.10.14 (see
    # pyoxidizer.bzl), where `datetime.UTC` does not exist. Applying this rule
    # would reintroduce the exact import that breaks every packaged build.
    "UP017",
]

[tool.ruff.lint.per-file-ignores]
# Both rules read the 3.11 floor from requires-python and conclude the 3.10
# fallback is dead code: UP036 calls the version block outdated, UP042 forbids
# the str/Enum mix that *is* StrEnum before 3.11. The packaged builds run 3.10
# (see the UP017 note above), so the block is live there. Confined to this file
# so both rules keep applying everywhere else.
"fpdb/compat.py" = ["UP036", "UP042"]

# Legacy display/SQL formatting uses width-sensitive percent specifiers that
# require dedicated migrations rather than unsafe mechanical rewrites.
"fpdb_3_legacy/Mucked.py" = ["UP031"]
"fpdb_3_legacy/PokerStarsSummary.py" = ["UP031"]

# Complexity ratchet. C901/PLR0912/PLR0915 are enforced everywhere; the files
# below predate that and are listed with the exact rules they still break, so
# a module that only exceeds one threshold stays guarded against the others.
# This list is a ratchet: entries come off as functions are split, and no entry
# may be added for newly written code. New violations in any file not listed
# here fail the build.
#
# Splitting a module off another moves its existing violations to a new file,
# which needs an entry of its own. That is the one case where the list grows,
# and only if the total does not: check the counts on both sides before and
# after with
#   ruff check --select C901,PLR0912,PLR0915 --isolated <files>
# so relocated debt cannot be mistaken for new debt.
"fpdb/infrastructure/platform/macos.py" = ["C901"]
"fpdb_3_legacy/AbsoluteToFpdb.py" = ["C901", "PLR0912"]
"fpdb_3_legacy/Aux_Classic_Hud.py" = ["C901", "PLR0912", "PLR0915"]
"fpdb_3_legacy/Aux_Hud.py" = ["C901", "PLR0912", "PLR0915"]
