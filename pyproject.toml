[tool.mypy]
python_version = "3.11"
# What is type-checked is configuration, not a list in the CI workflow (#454):
# CI runs a bare `mypy`. The whole application, and the tools and tests that
# were checked by name before. The two .pyw entry points are checked by a run
# each (`mypy fpdb_3_legacy/fpdb.pyw`): mypy names every script `__main__`, so
# two of them in one run collide.
files = [
    "fpdb_3_legacy",
    "fpdb",
    "tools/coverage_ratchet.py",
    "tools/fetch_pr_comments.py",
    "tools/fetch_pr_reviews.py",
    "tools/prepare_briefcase_resources.py",
    "tools/todo_inventory.py",
    "tools/validate_migration.py",
    "tests/test_draw_starting_hand.py",
    "tests/test_leak_detector.py",
    "tests/test_numpy_migration.py",
    "tests/test_opponents_report.py",
    "tests/qt/test_empty_data_popups.py",
]
check_untyped_defs = true
# Imports are followed: with "skip", every other fpdb module was Any, and a
# call with the wrong arguments into it was invisible.
follow_imports = "normal"
# CI installs mypy alone (`uv tool install mypy`), without PySide6, NumPy or
# the database drivers: their APIs are Any there rather than errors.
ignore_missing_imports = true
warn_unused_configs = true

# Tier A (#454): the modern, non-GUI modules, held to full annotations. A
# module of these groups that is not listed here is in STRICT_PENDING in
# tests/test_mypy_config.py, which may only shrink.
[[tool.mypy.overrides]]
module = [
    "fpdb_3_legacy.analytics_benchmark",
    "fpdb_3_legacy.analytics_cache",
    "fpdb_3_legacy.analytics_cohorts",
    "fpdb_3_legacy.analytics_definitions",
    "fpdb_3_legacy.analytics_lifecycle",
    "fpdb_3_legacy.analytics_profiling",
    "fpdb_3_legacy.analytics_profit",
    "fpdb_3_legacy.analytics_query",
    "fpdb_3_legacy.analytics_rebuild",
    "fpdb_3_legacy.database_aof",
    "fpdb_3_legacy.database_auto_notes",
    "fpdb_3_legacy.database_lambda_dict",
    "fpdb_3_legacy.database_schema",
    "fpdb_3_legacy.dialects",
    "fpdb_3_legacy.hand_review_payload",
    "fpdb_3_legacy.hand_share",
    "fpdb_3_legacy.phh_import",
    "fpdb_3_legacy.research_browser",
    "fpdb_3_legacy.research_differences",
    "fpdb_3_legacy.research_distributions",
    "fpdb_3_legacy.research_drilldown",
    "fpdb_3_legacy.research_hand_strength",
    "fpdb_3_legacy.research_labels",
    "fpdb_3_legacy.research_matrices",
    "fpdb_3_legacy.research_presets",
    "fpdb_3_legacy.research_studies",
    "fpdb_3_legacy.research_study_dashboard",
    "fpdb_3_legacy.research_study_explorer",
    "fpdb_3_legacy.research_views",
    "fpdb_3_legacy.research_worker_db",
    "fpdb_3_legacy.stat_packs",
    "fpdb_3_legacy.stat_registry",
    "fpdb_3_legacy.stats_action_enums",
    "fpdb_3_legacy.stats_aof",
    "fpdb_3_legacy.stats_context",
    "fpdb_3_legacy.stats_display",
    "fpdb_3_legacy.stats_financial",
    "fpdb_3_legacy.stats_formatting",
    "fpdb_3_legacy.stats_knockout",
    "fpdb_3_legacy.stats_postflop",
    "fpdb_3_legacy.stats_preflop",
    "fpdb_3_legacy.stats_sizing",
    "fpdb_3_legacy.stats_table",
    "fpdb_3_legacy.stats_tournament",
]
disallow_untyped_defs = true
warn_return_any = true

# No module is excused from type checking (`ignore_errors = true`). Should one
# ever need to be, it has to be listed in IGNORE_BASELINE in
# tests/test_mypy_config.py, which fails otherwise.

[tool.pyright]
include = [
    "fpdb",
    "tools/prepare_briefcase_resources.py",
    "tools/todo_inventory.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Platform adapters deliberately import native modules only available on their OS.
reportMissingImports = false

[tool.setuptools.packages.find]
where = ["."]
include = ["fpdb_3_legacy", "fpdb_3_legacy.*", "fpdb", "fpdb.*"]

[tool.setuptools.package-data]
# The bundled declarative libraries are data, not modules, and an installed
# package without them is quietly broken: an empty stat registry, dynamic
# panel rules that resolve to nothing, no popup packs, no shipped presets.
# Every ``*.d`` directory under the package has to be listed here -- PyOxidizer
# globs the extensions it allows and PyInstaller copies the directory whole,
# but setuptools installs modules only.
fpdb_3_legacy = [
    "analytics_cohorts.d/*.json",
    "analytics_definitions.d/*.json",
    "hud_situation.d/*.json",
    "popup_packs.d/*.json",
    "pt4_mapping.d/*.json",
    "research_presets.d/*.json",
    "research_studies.d/*.json",
    "stats.d/*.toml",
    # The SwC tap is compiled on the user's machine from these sources (#451).
    "capture/*.c",
]

[tool.coverage.run]
source = ["fpdb_3_legacy", "fpdb"]
branch = true
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.briefcase]
project_name = "Free Poker Database 3"
bundle = "org.fpdb"
version = "3.9.1"

[tool.briefcase.app.fpdb]
formal_name = "FPDB"
description = "Free Poker Database 3 - Legacy Edition"
sources = ["fpdb_3_legacy", "fpdb", ".briefcase-resources"]
requires = [
    "PySide6>=6.8.1",
    "pandas>=2.2.2",
    "psutil>=5.9.0",
    "colorlog==6.9.0",
    "pyzmq>=26.0.3",
    "qt-material==2.14",
    "numpy>=2.1.0",
    "pytz==2024.1",
    "aiohttp>=3.14.4",
    "cachetools==5.5.0",
    "xlrd==2.0.1",
    "defusedxml>=0.7.1",
    # Read by the Merge and Winamax summary parsers.
    "beautifulsoup4==4.12.3",
    # Imported when the user points fpdb at a MySQL database.
    "pymysql>=1.1.0",
    # Likewise for PostgreSQL.
    "psycopg[binary]>=3.1.0",
    # Native equity backend used by the equity calculator and AoF tools.
    "pypoker-eval @ git+https://github.com/jejellyroll-fr/poker-eval.git@v1.2.0",
    "pyqtgraph>=0.13.0",
]

[tool.briefcase.app.fpdb.macOS]
universal_build = false
min_os_version = "12.0"
# Cocoa alone is not enough: the HUD finds its tables through Quartz, and the
# screen-recording and accessibility checks go through ApplicationServices.
# Both are imported inside the functions that use them, and the ImportError is
# swallowed into "permission granted", so a package missing them does not fail
# loudly -- the HUD just never sees a table.
requires = [
    "pyobjc-framework-Cocoa==10.3.1",
    "pyobjc-framework-Quartz==10.3.1",
    "pyobjc-framework-ApplicationServices==10.3.1"
]

[tool.briefcase.app.fpdb.windows]
# comtypes is how the HUD reads a table's chairs through UIAutomation. It is
# imported inside the function that uses it and the ImportError is swallowed
# into "no reader on this machine", so a package missing it does not fail
# loudly -- the Fast-Fold HUD just falls back to the client log and shows its
# stat blocks one player at a time.
requires = [
    "pywin32==306",
    "comtypes>=1.4.1"
]

[tool.briefcase.app.fpdb.linux]
requires = [
    "xcffib==1.5.0"
]
