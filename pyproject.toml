[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pyright]
include = [
    "fpdb",
    "tools/prepare_briefcase_resources.py",
    "tools/todo_inventory.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Platform adapters deliberately import native modules only available on their OS.
reportMissingImports = false

[tool.setuptools.packages.find]
where = ["."]
include = ["fpdb_3_legacy", "fpdb_3_legacy.*", "fpdb", "fpdb.*"]

[tool.coverage.run]
source = ["fpdb_3_legacy", "fpdb"]
branch = true
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "fpdb_3_legacy/test_*.py",
    "fpdb_3_legacy/migrate_*.py",
    "fpdb_3_legacy/validate_*.py",
]

[tool.briefcase]
project_name = "Free Poker Database 3"
bundle = "org.fpdb"
version = "3.8.0"

[tool.briefcase.app.fpdb]
formal_name = "FPDB"
description = "Free Poker Database 3 - Legacy Edition"
sources = ["fpdb_3_legacy", "fpdb", ".briefcase-resources"]
requires = [
    "PySide6>=6.8.1",
    "pandas>=2.2.2",
    "psutil>=5.9.0",
    "colorlog==6.9.0",
    "pyzmq>=26.0.3",
    "qt-material==2.14",
    "numpy>=2.1.0",
    "pytz==2024.1",
    "aiohttp>=3.13.2",
    "cachetools==5.5.0",
    "xlrd==2.0.1",
    "playwright>=1.40.0",
    "defusedxml>=0.7.1",
    # Read by the Merge and Winamax summary parsers.
    "beautifulsoup4==4.12.3",
    # Imported when the user points fpdb at a MySQL database.
    "pymysql>=1.1.0",
    # Likewise for PostgreSQL.
    "psycopg[binary]>=3.1.0",
    # Native equity backend used by the equity calculator and AoF tools.
    "pypoker-eval @ git+https://github.com/jejellyroll-fr/poker-eval.git@v1.2.0",
    "pyqtgraph>=0.13.0",
]

[tool.briefcase.app.fpdb.macOS]
universal_build = false
min_os_version = "12.0"
# Cocoa alone is not enough: the HUD finds its tables through Quartz, and the
# screen-recording and accessibility checks go through ApplicationServices.
# Both are imported inside the functions that use them, and the ImportError is
# swallowed into "permission granted", so a package missing them does not fail
# loudly -- the HUD just never sees a table.
requires = [
    "pyobjc-framework-Cocoa==10.3.1",
    "pyobjc-framework-Quartz==10.3.1",
    "pyobjc-framework-ApplicationServices==10.3.1"
]

[tool.briefcase.app.fpdb.windows]
requires = [
    "pywin32==306"
]

[tool.briefcase.app.fpdb.linux]
requires = [
    "xcffib==1.5.0"
]
