[pytest]
# pytest configuration
testpaths = tests test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add the project root to the Python path
pythonpath = .

# Coverage options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not qt and not perf"

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    manual: marks tests as manual/interactive tests
    qt: PySide6/Qt UI tests (deselect with '-m "not qt"')
    perf: performance benchmark tests (deselect with '-m "not perf"')
    asyncio: async tests (provided by pytest-asyncio)
    benchmark: pytest-benchmark performance markers

# Ignore certain files/directories
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    archives
    regression-test-files
    .venv
    venv
