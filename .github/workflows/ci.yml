name: CI

on:
  push:
    branches: [ bigbang, main, development ]
  pull_request:
    branches: [ bigbang, main, development ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Ruff
        run: uv tool install ruff
      - name: Install mypy
        run: uv tool install mypy
      - name: Lint repository
        run: ruff check fpdb_3_legacy fpdb test tests
      - name: Type-check modernized core
        run: >-
          mypy
          fpdb_3_legacy/equity.py
          fpdb_3_legacy/dialects.py
          fpdb_3_legacy/pt4_adapter
          fpdb_3_legacy/http_capture_models.py
          fpdb_3_legacy/http_capture_actions.py
          fpdb_3_legacy/http_capture_adapter.py
          fpdb_3_legacy/http_capture_diff.py
          fpdb_3_legacy/http_capture_hand_builder.py
          fpdb_3_legacy/http_capture_db_import.py
          fpdb_3_legacy/http_capture_ofc.py
          fpdb_3_legacy/swc_http_adapter.py
          fpdb_3_legacy/menu_layout.py
          fpdb_3_legacy/i18n.py
          fpdb_3_legacy/i18n_compile.py
          fpdb_3_legacy/ConfigInitializer.py
          fpdb_3_legacy/db_backends.py
          fpdb_3_legacy/db_migrate.py
          fpdb_3_legacy/http_capture_importability.py
          fpdb_3_legacy/http_capture_registry.py
          fpdb_3_legacy/http_capture_archive.py
          fpdb_3_legacy/http_capture_build.py
          fpdb_3_legacy/http_capture_refresh.py
          fpdb_3_legacy/http_capture_replay.py
          fpdb_3_legacy/http_capture_analyze.py
          fpdb_3_legacy/swc_http_capture.py
          fpdb_3_legacy/stat_adapters.py
          fpdb_3_legacy/AutoNoteRules.py
          fpdb_3_legacy/AutoNotes.py
          fpdb_3_legacy/PlayerProfiler.py
          fpdb_3_legacy/Exceptions.py
          fpdb_3_legacy/ConfigObservers.py
          fpdb_3_legacy/AutoImportConfigObserver.py
          fpdb_3_legacy/PopupIcons.py
          fpdb_3_legacy/ModernPopup.py
          fpdb_3_legacy/L10n.py
          fpdb_3_legacy/Options.py
          fpdb_3_legacy/RegressionFileComparator.py
          fpdb_3_legacy/PopupThemes.py
          fpdb_3_legacy/ThemeManager.py
      - name: Lint newly modernized modules
        run: >-
          ruff check
          fpdb_3_legacy/equity.py
          fpdb_3_legacy/PartyPokerSummary.py
          test/test_equity.py
          test/test_live_parser_regression.py
          test/test_partypoker_summary.py
          test/test_stats_known_hands.py
          tests/helpers/parser_regression.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
      - name: Run tests (no GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -p no:pytest-qt -m "not qt and not perf" --tb=short

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[build]"
      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/HUD_main.pyw"
          else
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/HUD_main.pyw"
          fi
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fpdb-build-${{ matrix.os }}
          path: dist/
