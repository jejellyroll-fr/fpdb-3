  # The interposer carries a distinct #ifdef branch per platform -- dlsym on
  # POSIX, GetModuleHandleA over the bundled OpenSSL DLLs on Windows. Compiling
  # it only where CI happens to run would leave two of the three branches
  # unbuilt, so each one is compiled on its own runner.
  #
  # swc_tap_build imports nothing but the standard library, so this needs no
  # project install: it is a compiler check, not an import check.
  interposer:
    name: Compile SwC interposer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the tap
        run: python -m fpdb_3_legacy.swc_tap_build --build

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
      - name: Run tests (no GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -p no:pytest-qt -m "not qt and not perf" --tb=short
      - name: Run Qt regression tests (offscreen)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m qt --tb=short
      # The perf tests assert wall-clock budgets, some as tight as 5 ms for a
      # loop of pure-Python work. Hosted runners are shared and noisy -- the
      # Windows ones especially -- so as a required check on all three they
      # would fail on runner scheduling far more often than on a real
      # regression, and a check that cries wolf stops being read. Run them on
      # Linux, where the numbers are the most comparable between runs, and
      # report without blocking the merge.
      - name: Run performance tests (offscreen, advisory)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m perf --tb=short

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install fpdb dependencies
        run: |
          uv pip install --system -e ".[test]"
      - name: Build and install pypoker-eval
        run: |
          git clone --depth 1 https://github.com/jejellyroll-fr/poker-eval.git /tmp/poker-eval
          uv pip install --system /tmp/poker-eval
      - name: Smoke-test native backend
        run: |
          python -c "from fpdb_3_legacy.equity import load_poker_eval; pe = load_poker_eval(); assert pe is not None, 'load_poker_eval() returned None'; print('backend loaded:', type(pe))"
      - name: Run native equity tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          native_tests=(test/test_equity.py)
          for f in test/test_aof_equity.py test/test_aof_ranges.py; do
            if [[ -f "$f" ]]; then
              native_tests+=("$f")
            fi
          done
          python -m pytest "${native_tests[@]}" -x -v --tb=short

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
      # Both selections feed one combined report: the Qt suite covers the views,
      # and the floors of coverage-baseline.json are seeded from the union.
      - name: Measure coverage (no GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -p no:pytest-qt -m "not qt and not perf" --cov --cov-report= --tb=short
      - name: Measure coverage (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m qt --cov --cov-append --cov-report= --tb=short
      - name: Render coverage reports
        run: |
          python -m coverage json -o coverage.json
          python -m coverage html -d htmlcov
          python -m coverage report --skip-covered
      - name: Enforce coverage ratchet
        run: python tools/coverage_ratchet.py --check coverage.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            htmlcov

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fpdb
          POSTGRES_USER: fpdb
          POSTGRES_PASSWORD: fpdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpdb -d fpdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fpdb
          MYSQL_USER: fpdb
          MYSQL_PASSWORD: fpdb
          MYSQL_ROOT_PASSWORD: fpdb-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufpdb -pfpdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install database test dependencies
        run: uv pip install --system -e ".[test-no-gui]"
      - name: Exercise live schemas, HUD transactions, and cross-backend migration
        env:
          FPDB_TEST_DATABASES: postgresql,mysql
        run: >-
          python -m pytest -q -p no:pytest-qt
          test/test_database_backend_integration.py
          test/test_hud_postgresql_integration.py

  build:
    name: Build with PyInstaller (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            artifact: fpdb-pyinstaller-linux-x64
          - os: windows-latest
            label: Windows x64
            artifact: fpdb-pyinstaller-windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[build]"
      - name: Compile translation catalogs
        run: python tools/compile_translations.py
      - name: Build with PyInstaller
        shell: bash
        run: |
          # numpy is only reached through import_module() in Database.py, so
          # PyInstaller cannot see it. Without the explicit hidden import the
          # HUD build ships none of its Python modules while the merged
          # distribution still exposes numpy's compiled sub-packages, and
          # "import numpy" then yields an empty namespace package.
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/HUD_main.pyw"
          else
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/HUD_main.pyw"
          fi
      - name: Bundle HUD inside fpdb
        run: python tools/bundle_pyinstaller_hud.py dist
      - name: Package build artifact
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: tar -czf "$ARTIFACT.tar.gz" -C dist fpdb
      - name: Upload Build Artifacts
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          compression-level: 0
      # macOS is distributed only by build-pyoxidizer. Keep the runner guard as
      # defense in depth if a macOS entry is ever accidentally reintroduced.
      - name: Attach PyInstaller build to the release
        if: github.event_name == 'release' && runner.os != 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.artifact }}.tar.gz
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  build-pyoxidizer:
    name: Build with PyOxidizer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Needed by the release-asset upload step below; read-only elsewhere.
    permissions:
      contents: write
    # PyOxidizer 0.24's cargo_toml parser cannot read the Rust 2024 edition
    # emitted by `cargo init` since Rust 1.85.
    env:
      RUSTUP_TOOLCHAIN: "1.83.0"
      # release/published covers both final releases and published prereleases
      # (including RCs), so neither may fall back to an ad-hoc identity.
      FPDB_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '-' }}
      FPDB_REQUIRE_STABLE_MACOS_SIGNING: ${{ secrets.MACOS_SIGNING_IDENTITY != '' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            pyoxidizer_host: x86_64-unknown-linux-musl
            pyoxidizer_archive: tar.gz
            pyoxidizer_sha256: a7847f7b8111f0d73edc3d2594c5dd4dd853006360a9e7f5e91565257fef5c3e
            target: x86_64-unknown-linux-gnu
            executable: fpdb
            artifact: fpdb-pyoxidizer-linux-x64
          - label: macOS ARM64
            os: macos-latest
            pyoxidizer_host: aarch64-apple-darwin
            pyoxidizer_archive: tar.gz
            pyoxidizer_sha256: 65976b0b505857f7f43ea30de35ef6305383e54ddfae90086fd641ca14d0487f
            target: aarch64-apple-darwin
            executable: fpdb
            artifact: fpdb-pyoxidizer-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS release credentials
        if: runner.os == 'macOS' && github.event_name == 'release'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "${FPDB_MACOS_SIGNING_IDENTITY}" || "${FPDB_MACOS_SIGNING_IDENTITY}" == "-" ]]; then
            echo "::warning::MACOS_SIGNING_IDENTITY secret is not configured in repository; macOS release will use ad-hoc signing."
            exit 0
          fi
          missing=0
          for name in FPDB_MACOS_SIGNING_IDENTITY MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_API_KEY_P8_BASE64 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" || "${!name}" == "-" ]]; then
              echo "::error::Missing required macOS release credential: $name"
              missing=1
            fi
          done
          if [[ "$FPDB_MACOS_SIGNING_IDENTITY" != "Developer ID Application: "* ]] ||
             [[ ! "$FPDB_MACOS_SIGNING_IDENTITY" =~ \([A-Z0-9]{10}\)$ ]]; then
            echo "::error::MACOS_SIGNING_IDENTITY must be a Developer ID Application identity ending in a 10-character Team ID"
            missing=1
          fi
          exit "$missing"
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && github.event_name == 'release' && env.FPDB_REQUIRE_STABLE_MACOS_SIGNING == '1'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Rust compatible with PyOxidizer
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc --version
          cargo --version
      - name: Cache PyOxidizer build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.cache/pyoxidizer
            ~/Library/Caches/pyoxidizer
            ~/AppData/Local/pyoxidizer
          key: pyoxidizer-${{ runner.os }}-${{ runner.arch }}-0.24.0-rust-1.83.0-${{ hashFiles('pyoxidizer.bzl', 'pyoxidizer-requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            pyoxidizer-${{ runner.os }}-${{ runner.arch }}-0.24.0-rust-1.83.0-
      - name: Install PyOxidizer
        shell: bash
        run: |
          pyoxidizer_asset="pyoxidizer-0.24.0-${{ matrix.pyoxidizer_host }}.${{ matrix.pyoxidizer_archive }}"
          pyoxidizer_archive="$RUNNER_TEMP/$pyoxidizer_asset"
          pyoxidizer_dir="$RUNNER_TEMP/pyoxidizer-0.24.0-${{ matrix.pyoxidizer_host }}"
          curl --fail --location --retry 3 \
            --output "$pyoxidizer_archive" \
            "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer/0.24.0/$pyoxidizer_asset"
          python -c "import hashlib, pathlib, sys; actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); assert actual == sys.argv[2], actual" \
            "$pyoxidizer_archive" "${{ matrix.pyoxidizer_sha256 }}"
          if [[ "$pyoxidizer_archive" == *.zip ]]; then
            python -m zipfile -e "$pyoxidizer_archive" "$RUNNER_TEMP"
          else
            mkdir -p "$pyoxidizer_dir"
            tar -xzf "$pyoxidizer_archive" --strip-components=1 -C "$pyoxidizer_dir"
          fi
          echo "$pyoxidizer_dir" >> "$GITHUB_PATH"
      - name: Compile translation catalogs
        run: python tools/compile_translations.py
      - name: Build with PyOxidizer
        shell: bash
        run: |
          if ! pyoxidizer --system-rust build --release > pyoxidizer-build.log 2>&1; then
            tail -n 500 pyoxidizer-build.log
            exit 1
          fi
          tail -n 100 pyoxidizer-build.log
      - name: Verify PyOxidizer bundle
        shell: bash
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          test -f "$install_dir/${{ matrix.executable }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            test -x "$install_dir/${{ matrix.executable }}"
          fi
          test -f "$install_dir/gfx/tribal.jpg"
          test -f "$install_dir/locale/fr_FR/LC_MESSAGES/fpdb.mo"
          # The launcher is the interpreter of every helper process, so a
          # broken payload layout or search path must fail the build here.
          "$install_dir/${{ matrix.executable }}" --run-module fpdb_3_legacy.subprocess_launch
      - name: Assemble PyOxidizer macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Defense in depth; pyoxidizer.bzl also sets dont_write_bytecode
          # because the embedded interpreter may ignore this environment flag.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          mkdir -p dist
          python -m tools.package_pyoxidizer_macos "$install_dir" dist/fpdb.app --icon gfx/tribal.icns --defer-signing
          dist/fpdb.app/Contents/MacOS/fpdb --hud --help
          dist/fpdb.app/Contents/MacOS/fpdb --run-module fpdb_3_legacy.OSXTables
          dist/fpdb.app/Contents/MacOS/fpdb --run-module fpdb.infrastructure.platform.macos
          python -m tools.package_pyoxidizer_macos --sign-existing dist/fpdb.app
          # Prove that a fresh filesystem import cannot mutate the sealed app.
          # This module is intentionally absent from the pre-sign smoke list.
          dist/fpdb.app/Contents/MacOS/fpdb --run-module fpdb_3_legacy.winamax_ax_seats
          codesign --verify --deep --strict dist/fpdb.app
          if [[ "${{ github.event_name }}" == "release" ]]; then
            codesign -dv --verbose=4 dist/fpdb.app 2> "$RUNNER_TEMP/fpdb-signature.txt"
            codesign -dr - dist/fpdb.app 2> "$RUNNER_TEMP/fpdb-requirement.txt"
            codesign -d --entitlements :- dist/fpdb.app > "$RUNNER_TEMP/fpdb-entitlements.plist" 2>/dev/null
            if [[ "$FPDB_MACOS_SIGNING_IDENTITY" =~ \(([A-Z0-9]{10})\)$ ]]; then
              expected_team_id="${BASH_REMATCH[1]}"
            else
              echo "::error::Could not extract Team ID from Developer ID identity"
              exit 1
            fi
            grep -Fqx "Authority=$FPDB_MACOS_SIGNING_IDENTITY" "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Fqx "TeamIdentifier=$expected_team_id" "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Fxq 'Identifier=org.fpdb.fpdb3' "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Fq 'identifier "org.fpdb.fpdb3"' "$RUNNER_TEMP/fpdb-requirement.txt"
            grep -Fq 'anchor apple generic' "$RUNNER_TEMP/fpdb-requirement.txt"
            if grep -q 'designated => cdhash' "$RUNNER_TEMP/fpdb-requirement.txt"; then
              echo "::error::Release signature still has a version-specific cdhash requirement"
              exit 1
            fi
            grep -q 'com.apple.security.automation.apple-events' "$RUNNER_TEMP/fpdb-entitlements.plist"
          fi
      - name: Notarize and staple PyOxidizer macOS release
        if: runner.os == 'macOS' && github.event_name == 'release' && env.FPDB_REQUIRE_STABLE_MACOS_SIGNING == '1'
        shell: bash
        env:
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          python -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["MACOS_NOTARY_API_KEY_P8_BASE64"]))' "$RUNNER_TEMP/fpdb-notary-key.p8"
          ditto -c -k --keepParent dist/fpdb.app "$RUNNER_TEMP/fpdb-pyoxidizer-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/fpdb-pyoxidizer-notary.zip" --key "$RUNNER_TEMP/fpdb-notary-key.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/fpdb.app
          xcrun stapler validate dist/fpdb.app
          codesign --verify --deep --strict --verbose=2 dist/fpdb.app
          spctl --assess --type execute --verbose=4 dist/fpdb.app
      - name: Package PyOxidizer artifact
        shell: bash
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --verify --deep --strict dist/fpdb.app
            cp docs/macos-gatekeeper.md dist/READ-ME-FIRST-macos.md
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist fpdb.app READ-ME-FIRST-macos.md
            verify_dir="$(mktemp -d "$RUNNER_TEMP/fpdb-pyoxidizer-artifact.XXXXXX")"
            tar -xzf "${{ matrix.artifact }}.tar.gz" -C "$verify_dir"
            codesign --verify --deep --strict --verbose=2 "$verify_dir/fpdb.app"
            if [[ "${{ github.event_name }}" == "release" && "$FPDB_MACOS_SIGNING_IDENTITY" != "-" ]]; then
              xcrun stapler validate "$verify_dir/fpdb.app"
              spctl --assess --type execute --verbose=4 "$verify_dir/fpdb.app"
            fi
          else
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$install_dir" .
          fi
      - name: Upload PyOxidizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          compression-level: 0
      # On a published release, the same tarball also becomes a downloadable
      # release asset, so users do not need a GitHub account to fetch a build.
      - name: Attach PyOxidizer build to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.artifact }}.tar.gz
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
