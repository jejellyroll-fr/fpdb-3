          mypy
          fpdb_3_legacy/ring_stats
          fpdb_3_legacy/test_feature_1_1.py
          fpdb_3_legacy/test_migration.py
          fpdb_3_legacy/validate_migration.py
      - name: Lint newly modernized modules
        run: >-
          ruff check
          fpdb_3_legacy/equity.py
