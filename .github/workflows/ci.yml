name: CI

on:
  push:
    branches: [ bigbang, main, development ]
  pull_request:
    branches: [ bigbang, main, development ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Ruff
        run: uv tool install ruff
      - name: Install mypy
        run: uv tool install mypy
      - name: Install Pyright
        run: uv tool install pyright
      - name: Lint repository
        run: ruff check fpdb_3_legacy fpdb test tests tools
      - name: Prepare compiled translation resources
        run: python tools/prepare_briefcase_resources.py
      - name: Verify technical-debt inventory
        run: python tools/todo_inventory.py --check
      - name: Type-check modernized core
        run: >-
          mypy
          fpdb
          tools/prepare_briefcase_resources.py
          tools/todo_inventory.py
          tools/coverage_ratchet.py
          fpdb_3_legacy/__init__.py
          fpdb_3_legacy/equity.py
          fpdb_3_legacy/fpdb_api.py
          fpdb_3_legacy/HandDataReporter.py
