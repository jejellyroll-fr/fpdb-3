  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
      - name: Run tests (no GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -p no:pytest-qt -m "not qt and not perf" --tb=short
      - name: Run Qt regression tests (offscreen)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m qt --tb=short

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
      # Both selections feed one combined report: the Qt suite covers the views,
      # and the floors of coverage-baseline.json are seeded from the union.
      - name: Measure coverage (no GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -p no:pytest-qt -m "not qt and not perf" --cov --cov-report= --tb=short
      - name: Measure coverage (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m qt --cov --cov-append --cov-report= --tb=short
      - name: Render coverage reports
        run: |
          python -m coverage json -o coverage.json
          python -m coverage html -d htmlcov
          python -m coverage report --skip-covered
      - name: Enforce coverage ratchet
        run: python tools/coverage_ratchet.py --check coverage.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            htmlcov

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fpdb
          POSTGRES_USER: fpdb
          POSTGRES_PASSWORD: fpdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpdb -d fpdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fpdb
          MYSQL_USER: fpdb
          MYSQL_PASSWORD: fpdb
          MYSQL_ROOT_PASSWORD: fpdb-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufpdb -pfpdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install database test dependencies
        run: uv pip install --system -e ".[test-no-gui]"
      - name: Exercise live schemas and cross-backend migration
        env:
          FPDB_TEST_DATABASES: postgresql,mysql
        run: python -m pytest -q -p no:pytest-qt test/test_database_backend_integration.py

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[build]"
      - name: Compile translation catalogs
        run: python tools/compile_translations.py
      - name: Build with PyInstaller
        shell: bash
        run: |
          # numpy is only reached through import_module() in Database.py, so
          # PyInstaller cannot see it. Without the explicit hidden import the
          # HUD build ships none of its Python modules while the merged
          # distribution still exposes numpy's compiled sub-packages, and
          # "import numpy" then yields an empty namespace package.
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/HUD_main.pyw"
          else
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --hidden-import numpy --hidden-import fpdb_3_legacy.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/HUD_main.pyw"
          fi
      - name: Bundle HUD inside fpdb
        run: python tools/bundle_pyinstaller_hud.py dist
      - name: Re-sign assembled macOS application
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/fpdb.app
      - name: Package build artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp docs/macos-gatekeeper.md dist/READ-ME-FIRST-macos.md
            tar -czf fpdb-build.tar.gz -C dist fpdb.app READ-ME-FIRST-macos.md
          else
            tar -czf fpdb-build.tar.gz -C dist fpdb
          fi
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fpdb-build-${{ matrix.os }}
          path: fpdb-build.tar.gz

  build-pyoxidizer:
    name: Build with PyOxidizer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # PyOxidizer 0.24's cargo_toml parser cannot read the Rust 2024 edition
    # emitted by `cargo init` since Rust 1.85.
    env:
      RUSTUP_TOOLCHAIN: "1.83.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            pyoxidizer_host: x86_64-unknown-linux-musl
            pyoxidizer_archive: tar.gz
            pyoxidizer_sha256: a7847f7b8111f0d73edc3d2594c5dd4dd853006360a9e7f5e91565257fef5c3e
            target: x86_64-unknown-linux-gnu
            executable: fpdb
            artifact: fpdb-pyoxidizer-linux-x64
          - label: macOS ARM64
            os: macos-latest
            pyoxidizer_host: aarch64-apple-darwin
            pyoxidizer_archive: tar.gz
            pyoxidizer_sha256: 65976b0b505857f7f43ea30de35ef6305383e54ddfae90086fd641ca14d0487f
            target: aarch64-apple-darwin
            executable: fpdb
            artifact: fpdb-pyoxidizer-macos-arm64
          - label: Windows x64
            os: windows-latest
            pyoxidizer_host: x86_64-pc-windows-msvc
            pyoxidizer_archive: zip
            pyoxidizer_sha256: c1b757bc7c64921b38bf5fd70d2a2e2f591d36fe1cae3b5722822c08f651ba7b
            target: x86_64-pc-windows-msvc
            executable: fpdb.exe
            artifact: fpdb-pyoxidizer-windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Rust compatible with PyOxidizer
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc --version
          cargo --version
      - name: Cache PyOxidizer build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.cache/pyoxidizer
            ~/Library/Caches/pyoxidizer
            ~/AppData/Local/pyoxidizer
          key: pyoxidizer-${{ runner.os }}-${{ runner.arch }}-0.24.0-rust-1.83.0-${{ hashFiles('pyoxidizer.bzl', 'pyproject.toml') }}
          restore-keys: |
            pyoxidizer-${{ runner.os }}-${{ runner.arch }}-0.24.0-rust-1.83.0-
      - name: Install PyOxidizer
        shell: bash
        run: |
          pyoxidizer_asset="pyoxidizer-0.24.0-${{ matrix.pyoxidizer_host }}.${{ matrix.pyoxidizer_archive }}"
          pyoxidizer_archive="$RUNNER_TEMP/$pyoxidizer_asset"
          pyoxidizer_dir="$RUNNER_TEMP/pyoxidizer-0.24.0-${{ matrix.pyoxidizer_host }}"
          curl --fail --location --retry 3 \
            --output "$pyoxidizer_archive" \
            "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer/0.24.0/$pyoxidizer_asset"
          python -c "import hashlib, pathlib, sys; actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); assert actual == sys.argv[2], actual" \
            "$pyoxidizer_archive" "${{ matrix.pyoxidizer_sha256 }}"
          if [[ "$pyoxidizer_archive" == *.zip ]]; then
            python -m zipfile -e "$pyoxidizer_archive" "$RUNNER_TEMP"
          else
            mkdir -p "$pyoxidizer_dir"
            tar -xzf "$pyoxidizer_archive" --strip-components=1 -C "$pyoxidizer_dir"
          fi
          echo "$pyoxidizer_dir" >> "$GITHUB_PATH"
      - name: Compile translation catalogs
        run: python tools/compile_translations.py
      - name: Build with PyOxidizer
        shell: bash
        run: |
          if ! pyoxidizer --system-rust build --release > pyoxidizer-build.log 2>&1; then
            tail -n 500 pyoxidizer-build.log
            exit 1
          fi
          tail -n 100 pyoxidizer-build.log
      - name: Verify PyOxidizer bundle
        shell: bash
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          test -f "$install_dir/${{ matrix.executable }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            test -x "$install_dir/${{ matrix.executable }}"
          fi
          test -f "$install_dir/gfx/tribal.jpg"
          test -f "$install_dir/locale/fr_FR/LC_MESSAGES/fpdb.mo"
          # The launcher is the interpreter of every helper process, so a
          # broken payload layout or search path must fail the build here.
          "$install_dir/${{ matrix.executable }}" --run-module fpdb_3_legacy.subprocess_launch
      - name: Package PyOxidizer artifact
        shell: bash
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # A loose directory means one quarantined download per dylib, and
            # Gatekeeper prompts for each of them. Ship a signed bundle: it is
            # assessed as a unit, so the user approves the app once.
            mkdir -p dist
            python -m tools.package_pyoxidizer_macos "$install_dir" dist/fpdb.app --icon gfx/tribal.icns
            codesign --verify --deep --strict dist/fpdb.app
            dist/fpdb.app/Contents/MacOS/fpdb --run-module fpdb_3_legacy.subprocess_launch
            cp docs/macos-gatekeeper.md dist/READ-ME-FIRST-macos.md
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist fpdb.app READ-ME-FIRST-macos.md
          else
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$install_dir" .
          fi
      - name: Upload PyOxidizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          compression-level: 0
