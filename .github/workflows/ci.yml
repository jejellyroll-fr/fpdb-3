name: CI

on:
  push:
    branches: [ bigbang, main, development ]
    # Pushing a version tag cuts a release: the release job below drafts it,
    # the build jobs attach their archives, and it is published once they
    # and the tests pass. `gh release create vX.Y.Z` and the GitHub release
    # form create the tag too, so they go through the same path.
    tags: [ 'v*' ]
  pull_request:
    # Feature branches too: a stacked pull request targets its parent branch,
    # and without this it would merge having never run a single test.
    branches: [ bigbang, main, development, 'feature/**', 'fix/**', 'release/**' ]
  workflow_dispatch:

env:
  # The one place every job's uv version is pinned; keep it in sync with
  # [tool.uv] required-version in pyproject.toml.
  UV_VERSION: "0.12.7"
  # Constraints every `uv pip install` below applies (PySide6 below 6.12: see the file).
  UV_CONSTRAINT: .github/ci-constraints.txt
  # The release this run builds for: the version tag it runs on, or empty for
  # a branch. A run started by hand on a tag (`gh workflow run CI --ref vX.Y.Z`)
  # rebuilds that release's archives.
  FPDB_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  config-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check configuration template versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$RUNNER_TEMP/fpdb-config-base"
          mkdir -p "$base_dir/fpdb_3_legacy"
          for path in HUD_config.xml HUD_config.xml.example fpdb_3_legacy/HUD_config.xml.example; do
            git show "$BASE_SHA:$path" > "$base_dir/$path"
          done
          python3 tools/check_config_version.py --base-dir "$base_dir"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Ruff
        run: uv tool install ruff
      - name: Install mypy
        run: uv tool install mypy
      - name: Install Pyright
        run: uv tool install pyright
      - name: Lint repository
        run: ruff check fpdb_3_legacy fpdb tests tools
      - name: Prepare compiled translation resources
        run: python tools/prepare_briefcase_resources.py
      - name: Check translations are merged with the source
        # Prints each language's completion; fails when locale/fpdb.pot or a
        # catalogue lags the source (fix: python tools/update_pot.py --merge).
        run: |
          bash .github/scripts/apt-install.sh gettext
          python tools/update_pot.py --check
      - name: Verify technical-debt inventory
        run: python tools/todo_inventory.py --check
      - name: Type-check the application
        # What is checked is pyproject.toml's [tool.mypy] (#454): the whole
        # application with imports followed, a strict tier, and no file list
        # here to forget a module in.
        run: mypy
      - name: Type-check the two entry-point scripts
        # mypy names every script __main__, so each needs a run of its own.
        run: |
          mypy --no-warn-unused-configs fpdb_3_legacy/fpdb.pyw
          mypy --no-warn-unused-configs fpdb_3_legacy/HUD_main.pyw
      - name: Cross-check modern modules with Pyright
        run: pyright
      - name: Lint newly modernized modules
        run: >-
          ruff check
          fpdb_3_legacy/equity.py
          fpdb_3_legacy/PartyPokerSummary.py
          tests/test_equity.py
          tests/test_live_parser_regression.py
          tests/test_partypoker_summary.py
          tests/test_stats_known_hands.py
          tests/helpers/parser_regression.py

  # The interposer carries a distinct #ifdef branch per platform -- dlsym on
  # POSIX, and on Windows an inline hook of ssleay32.dll installed by an injected
  # DLL. Compiling it only where CI happens to run would leave branches unbuilt,
  # so each one is compiled on its own runner. On Windows this builds two 32-bit
  # artifacts (the tap DLL and its injector) to match the 32-bit SwC client;
  # clang cross-targets the MSVC ABI using the runner's Windows SDK.
  #
  # swc_tap_build imports nothing but the standard library, so this needs no
  # project install: it is a compiler check, not an import check.
  interposer:
    name: Compile SwC interposer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure clang is available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          clang --version
      - name: Compile the tap
        run: python -m fpdb_3_legacy.capture.swc_tap_build --build

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu sources only, with a fallback mirror: see the script.
          bash .github/scripts/apt-install.sh libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
      - name: Install the Windows platform bindings
        if: runner.os == 'Windows'
        run: |
          uv pip install --system pywin32==306
      - name: Run FastHUD platform contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # These tests use deterministic Winamax captures and mocked platform
          # APIs, so they exercise the macOS and Windows contracts on every
          # runner without requiring a live poker client.
          python -m pytest -q -m "not qt" tests/test_fast_fold_replay.py tests/test_fast_fold_clockwise_mapping_and_cleanup.py tests/test_fast_fold_display_optimization.py tests/test_fast_fold_engine.py tests/test_winamax_ax_seats.py tests/test_windows_fast_fold_resolver.py

      - name: Run tests (no GUI) and check FastHUD coverage has not dropped
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # This is the whole no-GUI suite, run once: it used to run a second
          # time here just to measure these modules, which cost 10 to 28
          # minutes on every runner (#765).
          #
          # The Fast-Fold HUD's own modules are held at 100%, statements and
          # branches. They stand in for the platform APIs rather than calling
          # them, so this holds on every runner -- which is the point: a
          # Windows or Linux implementation must not be able to leave the
          # macOS paths untested. Lowering this number is the regression.
          #
          # One line, no backslash continuations: this job also runs on
          # windows-latest, where the default shell is PowerShell and a
          # trailing "\" makes it read the next line as a unary operator.
          python -m pytest -p no:pytest-qt -m "not qt and not perf" --tb=short --cov=fpdb_3_legacy.fast_fold_engine --cov=fpdb_3_legacy.winamax_ax_seats --cov=fpdb_3_legacy.winamax_live_log_reader --cov=fpdb_3_legacy.winamax_pool_games --cov=fpdb_3_legacy.hud_window_registry --cov=fpdb_3_legacy.hud_diagnostics --cov=fpdb_3_legacy.OSXTables --cov=fpdb_3_legacy.interlocks --cov=tools.find_hud_windows --cov-branch --cov-report=term-missing --cov-fail-under=100

      - name: Run FastHUD Qt regression tests (offscreen)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q -m qt tests/test_HUD_main.py
      - name: Run Qt regression tests (offscreen)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m "qt and not perf" --tb=short --durations=25
      # The perf tests assert wall-clock budgets, some as tight as 5 ms for a
      # loop of pure-Python work. Hosted runners are shared and noisy -- the
      # Windows ones especially -- so as a required check on all three they
      # would fail on runner scheduling far more often than on a real
      # regression, and a check that cries wolf stops being read. Run them on
      # Linux, where the numbers are the most comparable between runs, and
      # report without blocking the merge.
      - name: Run performance tests (offscreen, advisory)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m perf --tb=short

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/apt-install.sh libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install fpdb dependencies
        run: |
          uv pip install --system -e ".[test]"
      - name: Install released pypoker-eval wheel
        shell: bash
        run: |
          python_tag="cp${{ matrix.python-version }}"
          python_tag="${python_tag//./}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            wheel="pypoker_eval-1.2.0-${python_tag}-${python_tag}-macosx_11_0_arm64.whl"
          else
            wheel="pypoker_eval-1.2.0-${python_tag}-${python_tag}-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          fi
          url="https://github.com/jejellyroll-fr/poker-eval/releases/download/v1.2.0/${wheel}"
          # GitHub's release CDN answers 503 often enough to redden a build on
          # its own, and uv's own retries span about ten seconds -- shorter
          # than such a blip tends to last. Spacing a few attempts turns it
          # into a delay instead of a failed run that has to be restarted by
          # hand. A wheel that is genuinely missing still fails, just later.
          for attempt in 1 2 3; do
            if uv pip install --system "$url"; then
              exit 0
            fi
            echo "::warning::pypoker-eval wheel download failed (attempt ${attempt}/3); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Could not download the pypoker-eval wheel after 3 attempts: ${url}"
          exit 1
      - name: Smoke-test native backend
        run: |
          python -c "from fpdb_3_legacy.equity import load_poker_eval; pe = load_poker_eval(); assert pe is not None, 'load_poker_eval() returned None'; print('backend loaded:', type(pe))"
      - name: Run native equity tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          native_tests=(tests/test_equity.py)
          for f in tests/test_aof_equity.py tests/test_aof_ranges.py; do
            if [[ -f "$f" ]]; then
              native_tests+=("$f")
            fi
          done
          python -m pytest "${native_tests[@]}" -x -v --tb=short

  coverage:
    runs-on: ubuntu-latest
    # Write access for the badge step only, which runs on development pushes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install system dependencies
        run: |
          bash .github/scripts/apt-install.sh libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
      # Both selections feed one combined report: the Qt suite covers the views,
      # and the floors of coverage-baseline.json are seeded from the union.
      - name: Measure coverage (no GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -p no:pytest-qt -m "not qt and not perf" --cov --cov-report= --tb=short
      - name: Measure coverage (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m "qt and not perf" --cov --cov-append --cov-report= --tb=short --durations=25
      - name: Render coverage reports
        run: |
          python -m coverage json -o coverage.json
          python -m coverage html -d htmlcov
          python -m coverage report --skip-covered
      - name: Enforce coverage ratchet
        run: python tools/coverage_ratchet.py --check coverage.json
      # The README's coverage badge reads coverage.json on the orphan `badges`
      # branch through shields.io. One commit, replaced on each push to
      # development, so the branch only ever holds the latest figure.
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          badge_dir="$RUNNER_TEMP/badges"
          mkdir -p "$badge_dir"
          python tools/coverage_badge.py coverage.json "$badge_dir/coverage.json"
          cd "$badge_dir"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Coverage badge for ${GITHUB_SHA::8}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            htmlcov

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fpdb
          POSTGRES_USER: fpdb
          POSTGRES_PASSWORD: fpdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpdb -d fpdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fpdb
          MYSQL_USER: fpdb
          MYSQL_PASSWORD: fpdb
          MYSQL_ROOT_PASSWORD: fpdb-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufpdb -pfpdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install system dependencies
        run: |
          bash .github/scripts/apt-install.sh libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install database test dependencies
        run: uv pip install --system -e ".[test-no-gui]"
      - name: Exercise live schemas, HUD transactions, and cross-backend migration
        env:
          FPDB_TEST_DATABASES: postgresql,mysql
        run: >-
          python -m pytest -q -p no:pytest-qt
          tests/test_database_backend_integration.py
          tests/test_hud_postgresql_integration.py
          tests/test_import_round_trips_postgres.py

  release:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      drafted: ${{ steps.draft.outputs.drafted }}
    steps:
      - uses: actions/checkout@v4
      - name: Draft the release unless the tag already has one
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$FPDB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$FPDB_RELEASE_TAG already has a release; the builds attach to it."
            echo "drafted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${FPDB_RELEASE_TAG#v}"
          notes="docs/RELEASE_NOTES_${version}.md"
          args=(--draft --verify-tag --title "FPDB ${version}")
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::$notes not found; the release gets GitHub's generated notes"
            args+=(--generate-notes)
          fi
          # v3.10.0-rc1 and the like are prereleases.
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$FPDB_RELEASE_TAG" "${args[@]}" --repo "$GITHUB_REPOSITORY"
          echo "drafted=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build with PyInstaller (${{ matrix.label }})
    # Release artefacts only (#669). A branch push or a pull request runs the
    # checks above; these builds run for a version tag, which attaches them
    # to its release, or by hand from the Actions tab (workflow_dispatch).
    # `release` is skipped on a branch, hence the explicit status check.
    needs: release
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            artifact: fpdb-pyinstaller-linux-x64
          - os: windows-latest
            label: Windows x64
            artifact: fpdb-pyinstaller-windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/apt-install.sh libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[build]"
      - name: Compile translation catalogs
        run: python tools/compile_translations.py
      - name: Build with PyInstaller
        shell: bash
        run: |
          # numpy and pokereval are reached through import_module(), so
          # PyInstaller cannot reliably see them. Include both explicitly; the
          # equity smoke module below then proves the frozen native backend can
          # evaluate a PLO5 hand instead of silently falling back to no EV.
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import pokereval --hidden-import fpdb_3_legacy.equity_smoke --hidden-import comtypes --hidden-import comtypes.client --hidden-import fpdb_3_legacy.capture.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import pokereval --hidden-import fpdb_3_legacy.equity_smoke --hidden-import comtypes --hidden-import comtypes.client --hidden-import fpdb_3_legacy.capture.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy;fpdb_3_legacy" --add-data "gfx;gfx" --add-data "icons;icons" --add-data "fonts;fonts" --add-data "locale;locale" --add-data "HUD_config.xml;." "fpdb_3_legacy/HUD_main.pyw"
          else
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import pokereval --hidden-import fpdb_3_legacy.equity_smoke --hidden-import fpdb_3_legacy.capture.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/fpdb.pyw"
            python -m PyInstaller --noconfirm --onedir --windowed --log-level=DEBUG --paths=fpdb_3_legacy --paths=. --additional-hooks-dir=tools/pyinstaller_hooks --hidden-import numpy --hidden-import pokereval --hidden-import fpdb_3_legacy.equity_smoke --hidden-import fpdb_3_legacy.capture.coinpoker_live_capture --hidden-import fpdb_3_legacy.Aux_Hud --hidden-import fpdb_3_legacy.Aux_Classic_Hud --hidden-import fpdb_3_legacy.Mucked --icon="gfx/tribal.jpg" --add-data "fpdb_3_legacy:fpdb_3_legacy" --add-data "gfx:gfx" --add-data "icons:icons" --add-data "fonts:fonts" --add-data "locale:locale" --add-data "HUD_config.xml:." "fpdb_3_legacy/HUD_main.pyw"
          fi
      - name: Bundle HUD inside fpdb
        run: python tools/bundle_pyinstaller_hud.py dist
      - name: Smoke-test packaged PLO5 equity backend
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            dist/fpdb/fpdb.exe --run-module fpdb_3_legacy.equity_smoke
          else
            dist/fpdb/fpdb --run-module fpdb_3_legacy.equity_smoke
          fi
      - name: Package build artifact
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: tar -czf "$ARTIFACT.tar.gz" -C dist fpdb
      - name: Upload Build Artifacts
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          compression-level: 0
      # macOS is distributed only by build-pyoxidizer. Keep the runner guard as
      # defense in depth if a macOS entry is ever accidentally reintroduced.
      - name: Attach PyInstaller build to the release
        if: env.FPDB_RELEASE_TAG != '' && runner.os != 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.FPDB_RELEASE_TAG }}
          ASSET: ${{ matrix.artifact }}.tar.gz
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  build-pyoxidizer:
    name: Build with PyOxidizer (${{ matrix.label }})
    # Release artefacts only (#669). A branch push or a pull request runs the
    # checks above; these builds run for a version tag, which attaches them
    # to its release, or by hand from the Actions tab (workflow_dispatch).
    # `release` is skipped on a branch, hence the explicit status check.
    needs: release
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Needed by the release-asset upload step below; read-only elsewhere.
    permissions:
      contents: write
    # PyOxidizer 0.24's cargo_toml parser cannot read the Rust 2024 edition
    # emitted by `cargo init` since Rust 1.85.
    env:
      RUSTUP_TOOLCHAIN: "1.83.0"
      # A version tag covers both final releases and prereleases (including
      # RCs), so neither may fall back to an ad-hoc identity once one is set.
      FPDB_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '-' }}
      FPDB_REQUIRE_STABLE_MACOS_SIGNING: ${{ secrets.MACOS_SIGNING_IDENTITY != '' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            pyoxidizer_host: x86_64-unknown-linux-musl
            pyoxidizer_archive: tar.gz
            pyoxidizer_sha256: a7847f7b8111f0d73edc3d2594c5dd4dd853006360a9e7f5e91565257fef5c3e
            target: x86_64-unknown-linux-gnu
            executable: fpdb
            artifact: fpdb-pyoxidizer-linux-x64
          - label: macOS ARM64
            os: macos-latest
            pyoxidizer_host: aarch64-apple-darwin
            pyoxidizer_archive: tar.gz
            pyoxidizer_sha256: 65976b0b505857f7f43ea30de35ef6305383e54ddfae90086fd641ca14d0487f
            target: aarch64-apple-darwin
            executable: fpdb
            artifact: fpdb-pyoxidizer-macos-arm64
          # Windows is built again (it was dropped for Issue #225) so the
          # single-interpreter bundle can be compared against the PyInstaller
          # one. PyInstaller stays the supported Windows distribution.
          - label: Windows x64
            os: windows-latest
            pyoxidizer_host: x86_64-pc-windows-msvc
            pyoxidizer_archive: zip
            pyoxidizer_sha256: c1b757bc7c64921b38bf5fd70d2a2e2f591d36fe1cae3b5722822c08f651ba7b
            target: x86_64-pc-windows-msvc
            executable: fpdb.exe
            artifact: fpdb-pyoxidizer-windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS release credentials
        if: runner.os == 'macOS' && env.FPDB_RELEASE_TAG != ''
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          # An ad-hoc identity changes with every build, so macOS treats each
          # release as a different application: the Accessibility and
          # Automation grants the HUD needs stop applying after an update, and
          # the bundle is subject to App Translocation. That is a real cost,
          # and it is the cost every fpdb release has paid so far.
          #
          # With no identity configured at all, warn and carry on rather than
          # withhold the only macOS artefact the project ships. Once
          # MACOS_SIGNING_IDENTITY exists this becomes a hard gate again --
          # see the branch below, which fails when signing is configured only
          # halfway. A half-configured release must never quietly downgrade
          # itself to ad-hoc; that would be a mistake rather than a choice.
          if [[ -z "${FPDB_MACOS_SIGNING_IDENTITY}" || "${FPDB_MACOS_SIGNING_IDENTITY}" == "-" ]]; then
            echo "::warning::MACOS_SIGNING_IDENTITY is not configured: this release ships an ad-hoc macOS bundle. Users must re-grant Automation access after every update, and Gatekeeper will quarantine the app (see docs/macos-gatekeeper.md). Configure a Developer ID Application identity to publish a stable, notarised build."
            exit 0
          fi
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_API_KEY_P8_BASE64 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" || "${!name}" == "-" ]]; then
              echo "::error::Missing required macOS release credential: $name"
              missing=1
            fi
          done
          if [[ "$FPDB_MACOS_SIGNING_IDENTITY" != "Developer ID Application: "* ]] ||
             [[ ! "$FPDB_MACOS_SIGNING_IDENTITY" =~ \([A-Z0-9]{10}\)$ ]]; then
            echo "::error::MACOS_SIGNING_IDENTITY must be a Developer ID Application identity ending in a 10-character Team ID"
            missing=1
          fi
          exit "$missing"
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.FPDB_RELEASE_TAG != '' && env.FPDB_REQUIRE_STABLE_MACOS_SIGNING == '1'
        uses: apple-actions/import-codesign-certs@7abe6dfe88f6bf6b1fa06e6a5704a2605d897418 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Rust compatible with PyOxidizer
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc --version
          cargo --version
      - name: Cache PyOxidizer build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.cache/pyoxidizer
            ~/Library/Caches/pyoxidizer
            ~/AppData/Local/pyoxidizer
          key: pyoxidizer-${{ runner.os }}-${{ runner.arch }}-0.24.0-rust-1.83.0-${{ hashFiles('pyoxidizer.bzl', 'pyoxidizer-requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            pyoxidizer-${{ runner.os }}-${{ runner.arch }}-0.24.0-rust-1.83.0-
      - name: Install PyOxidizer
        shell: bash
        env:
          # The gh fallback below refuses to run in Actions without a token.
          GH_TOKEN: ${{ github.token }}
        run: |
          pyoxidizer_asset="pyoxidizer-0.24.0-${{ matrix.pyoxidizer_host }}.${{ matrix.pyoxidizer_archive }}"
          pyoxidizer_archive="$RUNNER_TEMP/$pyoxidizer_asset"
          pyoxidizer_dir="$RUNNER_TEMP/pyoxidizer-0.24.0-${{ matrix.pyoxidizer_host }}"
          # GitHub release assets occasionally return a transient 5xx before
          # the runner can reach them. Keep the build deterministic by retrying
          # the download itself; the checksum below still guards the artifact.
          if ! curl --fail --location --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 \
            --output "$pyoxidizer_archive" \
            "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer/0.24.0/$pyoxidizer_asset"; then
            # Some runner/asset combinations return a persistent 504 from the
            # browser-download endpoint. The CLI uses the release-assets API
            # instead and keeps the same asset name and checksum contract.
            echo "Direct PyOxidizer asset download failed; retrying through the GitHub release API."
            gh release download "pyoxidizer/0.24.0" \
              --repo indygreg/PyOxidizer \
              --pattern "$pyoxidizer_asset" \
              --output "$pyoxidizer_archive" \
              --clobber
          fi
          python -c "import hashlib, pathlib, sys; actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); assert actual == sys.argv[2], actual" \
            "$pyoxidizer_archive" "${{ matrix.pyoxidizer_sha256 }}"
          if [[ "$pyoxidizer_archive" == *.zip ]]; then
            python -m zipfile -e "$pyoxidizer_archive" "$RUNNER_TEMP"
          else
            mkdir -p "$pyoxidizer_dir"
            tar -xzf "$pyoxidizer_archive" --strip-components=1 -C "$pyoxidizer_dir"
          fi
          echo "$pyoxidizer_dir" >> "$GITHUB_PATH"
      - name: Compile translation catalogs
        run: python tools/compile_translations.py
      - name: Build with PyOxidizer
        shell: bash
        run: |
          if ! pyoxidizer --system-rust build --release > pyoxidizer-build.log 2>&1; then
            tail -n 500 pyoxidizer-build.log
            exit 1
          fi
          tail -n 100 pyoxidizer-build.log
      - name: Repair the wheel library payloads PyOxidizer loses
        shell: bash
        run: |
          # On Linux it installs "numpy.libs" as "numpy/libs", reading the dot
          # as a package separator; on Windows it does not collect the
          # directory at all. Either way the bundle cannot import numpy. The
          # tool moves what is misplaced and restores what is missing from the
          # wheel it came from, checked against the bundle's own RECORD
          # hashes. See its docstring.
          python -m tools.repair_wheel_payloads "build/${{ matrix.target }}/release/install" --wheel-dir "$RUNNER_TEMP/payload-wheels"
      - name: Verify PyOxidizer bundle
        shell: bash
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          test -f "$install_dir/${{ matrix.executable }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            test -x "$install_dir/${{ matrix.executable }}"
          fi
          test -f "$install_dir/gfx/tribal.jpg"
          test -f "$install_dir/locale/fr_FR/LC_MESSAGES/fpdb.mo"
          # The launcher is the interpreter of every helper process, so a
          # broken payload layout or search path must fail the build here.
          "$install_dir/${{ matrix.executable }}" --run-module fpdb_3_legacy.subprocess_launch
          # The HUD's first act is to import the platform package through the
          # fpdb namespace, and on Windows ".pyw" is an importable source
          # suffix: with the legacy directory ahead of the packaged libraries,
          # "import fpdb" found fpdb_3_legacy/fpdb.pyw and the HUD died on
          # "'fpdb' is not a package" every time auto-import started it. The
          # bundle above was otherwise perfectly good, so nothing here noticed.
          "$install_dir/${{ matrix.executable }}" --run-module fpdb.infrastructure.platform.factory
          # numpy's extension modules need the shared libraries their wheel
          # bundles in a top-level "numpy.libs" directory. PyOxidizer drops
          # anything it cannot classify, and that directory is not a package,
          # so this import is what tells a bundle that starts apart from one
          # that dies on "DLL load failed while importing _multiarray_umath"
          # before it can open a window. Everything above passed while the
          # Windows bundle could not start at all.
          #
          # The inventory is printed first: when this import fails, the next
          # question is always whether the payload is absent or merely
          # somewhere else, and the answer belongs in the same log.
          echo "--- wheel library payloads in the bundle:"
          find "$install_dir" -maxdepth 3 \( -name '*.libs' -o -name '*.dylibs' \) -print
          find "$install_dir" -name 'libscipy_openblas*' -print
          "$install_dir/${{ matrix.executable }}" --run-module numpy.__config__
      - name: Assemble PyOxidizer macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Defense in depth; pyoxidizer.bzl also sets dont_write_bytecode
          # because the embedded interpreter may ignore this environment flag.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          mkdir -p dist
          python -m tools.package_pyoxidizer_macos "$install_dir" dist/fpdb.app --icon gfx/tribal.icns --defer-signing
          dist/fpdb.app/Contents/MacOS/fpdb --hud --help
          dist/fpdb.app/Contents/MacOS/fpdb --run-module fpdb_3_legacy.OSXTables
          dist/fpdb.app/Contents/MacOS/fpdb --run-module fpdb.infrastructure.platform.macos
          python -m tools.package_pyoxidizer_macos --sign-existing dist/fpdb.app
          # Prove that a fresh filesystem import cannot mutate the sealed app.
          # This module is intentionally absent from the pre-sign smoke list.
          dist/fpdb.app/Contents/MacOS/fpdb --run-module fpdb_3_legacy.winamax_ax_seats
          codesign --verify --deep --strict dist/fpdb.app
          if [[ -n "$FPDB_RELEASE_TAG" && "$FPDB_REQUIRE_STABLE_MACOS_SIGNING" == "1" ]]; then
            codesign -dv --verbose=4 dist/fpdb.app 2> "$RUNNER_TEMP/fpdb-signature.txt"
            codesign -dr - dist/fpdb.app 2> "$RUNNER_TEMP/fpdb-requirement.txt"
            codesign -d --entitlements :- dist/fpdb.app > "$RUNNER_TEMP/fpdb-entitlements.plist" 2>/dev/null
            if [[ "$FPDB_MACOS_SIGNING_IDENTITY" =~ \(([A-Z0-9]{10})\)$ ]]; then
              expected_team_id="${BASH_REMATCH[1]}"
            else
              echo "::error::Could not extract Team ID from Developer ID identity"
              exit 1
            fi
            # "Signature=adhoc" is the one word that says this bundle has no
            # stable identity. Assert its absence explicitly rather than
            # inferring it from the Authority line being present.
            if grep -Fq 'Signature=adhoc' "$RUNNER_TEMP/fpdb-signature.txt"; then
              echo "::error::Release bundle is ad-hoc signed; it has no stable TCC identity and must not be published"
              exit 1
            fi
            grep -Fqx "Authority=$FPDB_MACOS_SIGNING_IDENTITY" "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Fqx "TeamIdentifier=$expected_team_id" "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Fxq 'Identifier=org.fpdb.fpdb3' "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' "$RUNNER_TEMP/fpdb-signature.txt"
            grep -Fq 'identifier "org.fpdb.fpdb3"' "$RUNNER_TEMP/fpdb-requirement.txt"
            grep -Fq 'anchor apple generic' "$RUNNER_TEMP/fpdb-requirement.txt"
            if grep -q 'designated => cdhash' "$RUNNER_TEMP/fpdb-requirement.txt"; then
              echo "::error::Release signature still has a version-specific cdhash requirement"
              exit 1
            fi
            grep -q 'com.apple.security.automation.apple-events' "$RUNNER_TEMP/fpdb-entitlements.plist"
          fi
      - name: Notarize and staple PyOxidizer macOS release
        if: runner.os == 'macOS' && env.FPDB_RELEASE_TAG != '' && env.FPDB_REQUIRE_STABLE_MACOS_SIGNING == '1'
        shell: bash
        env:
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          python -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["MACOS_NOTARY_API_KEY_P8_BASE64"]))' "$RUNNER_TEMP/fpdb-notary-key.p8"
          ditto -c -k --keepParent dist/fpdb.app "$RUNNER_TEMP/fpdb-pyoxidizer-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/fpdb-pyoxidizer-notary.zip" --key "$RUNNER_TEMP/fpdb-notary-key.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/fpdb.app
          xcrun stapler validate dist/fpdb.app
          codesign --verify --deep --strict --verbose=2 dist/fpdb.app
          spctl --assess --type execute --verbose=4 dist/fpdb.app
      - name: Package PyOxidizer artifact
        shell: bash
        run: |
          install_dir="build/${{ matrix.target }}/release/install"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --verify --deep --strict dist/fpdb.app
            cp docs/macos-gatekeeper.md dist/READ-ME-FIRST-macos.md
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist fpdb.app READ-ME-FIRST-macos.md
            verify_dir="$(mktemp -d "$RUNNER_TEMP/fpdb-pyoxidizer-artifact.XXXXXX")"
            tar -xzf "${{ matrix.artifact }}.tar.gz" -C "$verify_dir"
            codesign --verify --deep --strict --verbose=2 "$verify_dir/fpdb.app"
            if [[ -n "$FPDB_RELEASE_TAG" && "$FPDB_MACOS_SIGNING_IDENTITY" != "-" ]]; then
              xcrun stapler validate "$verify_dir/fpdb.app"
              spctl --assess --type execute --verbose=4 "$verify_dir/fpdb.app"
            fi
          else
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$install_dir" .
          fi
      - name: Upload PyOxidizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          compression-level: 0
      # On a version tag, the same tarball also becomes a downloadable release
      # asset, so users do not need a GitHub account to fetch a build.
      - name: Attach PyOxidizer build to the release
        if: env.FPDB_RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.FPDB_RELEASE_TAG }}
          ASSET: ${{ matrix.artifact }}.tar.gz
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    name: Publish the GitHub release
    # Only a release this run drafted: one made by hand stays as its author
    # left it. A failed build or test leaves the draft unpublished, with
    # whatever archives did build, for a look before publishing by hand.
    needs: [ release, build, build-pyoxidizer, quality, test ]
    if: needs.release.outputs.drafted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$FPDB_RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
