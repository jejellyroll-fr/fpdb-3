name: "CodeQL"

on:
  push:
    branches: [ bigbang, main, development ]
  pull_request:
    branches: [ bigbang, main, development ]
  schedule:
    - cron: '30 1 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # CodeQL scans Python files automatically. 
        # If you need to specify a Python version, you can uncomment the step below:
        # setup-python is useful if you have custom build dependencies.

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
