# Standard poker statistics as declarative descriptors, normalised onto FPDB-3
# legacy HandsPlayers columns (all verified to exist). These mirror the common
# PT4 stats but, unlike the ~600 native functions in Stats.py (HUD-only), they
# are surface-agnostic: the registry adapters expose them in the report grid.
#
# They are RATE stats (percentages), so they have no `series` — cumulative
# curves are for chip/EV metrics, not rates. Scope is ring+tour.
#
# Each value is "100 * <done> / <chance>"; the registry sums each input across
# the rows, then evaluates the ratio (division by zero renders as "-").

[[stat]]
name        = "vpip"
label       = "VPIP"
category    = "Standard / Preflop"
scope       = ["ring", "tour"]
inputs      = ["street0VPI", "street0VPIChance"]
value       = "100 * street0VPI / street0VPIChance"
aggregate   = "ratio"
format      = "%0.1f"
description = "Voluntarily put money in pot."

[[stat]]
name        = "pfr"
label       = "PFR"
category    = "Standard / Preflop"
scope       = ["ring", "tour"]
inputs      = ["street0Aggr", "street0AggrChance"]
value       = "100 * street0Aggr / street0AggrChance"
aggregate   = "ratio"
format      = "%0.1f"
description = "Preflop raise."

[[stat]]
name        = "rfi"
label       = "RFI"
category    = "Standard / Preflop"
scope       = ["ring", "tour"]
inputs      = ["raisedFirstIn", "raiseFirstInChance"]
value       = "100 * raisedFirstIn / raiseFirstInChance"
aggregate   = "ratio"
format      = "%0.1f"
description = "Raise first in (open raise)."

