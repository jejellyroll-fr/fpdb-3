# --- Advanced stats present in FPDB's data (DerivedStats computes them) but not
# surfaced as grid columns. Numerator/denominator match the native Stats.py
# definitions (float_turn/float_river/fold_to_squeeze) verbatim.

[[stat]]
name        = "float_turn"
label       = "Float Turn"
category    = "Standard / Postflop"
scope       = ["ring", "tour"]
inputs      = ["flg_t_float", "flg_t_float_opp"]
value       = "100 * flg_t_float / flg_t_float_opp"
aggregate   = "ratio"
format      = "%0.1f"
description = "Continued (bet/raise) the turn after floating the flop."

[[stat]]
name        = "float_river"
label       = "Float River"
category    = "Standard / Postflop"
scope       = ["ring", "tour"]
inputs      = ["flg_r_float", "flg_r_float_opp"]
value       = "100 * flg_r_float / flg_r_float_opp"
aggregate   = "ratio"
format      = "%0.1f"
description = "Continued (bet/raise) the river after floating the turn."

[[stat]]
name        = "fold_to_squeeze"
label       = "Fold to Squeeze"
category    = "Standard / Preflop"
scope       = ["ring", "tour"]
inputs      = ["street0_FoldToSqueezeDone", "street0_FoldToSqueezeChance"]
value       = "100 * street0_FoldToSqueezeDone / street0_FoldToSqueezeChance"
aggregate   = "ratio"
format      = "%0.1f"
description = "Folded preflop facing a squeeze 3-bet."

# Delayed turn c-bet — newly derived in DerivedStats._calc_delayed_turn_cbet and
# persisted to HandsPlayers (street2DelayedCB*). Populates on re-import.
[[stat]]
name        = "delayed_cbet_turn"
label       = "Delayed C-bet Turn"
category    = "Standard / Postflop"
scope       = ["ring", "tour"]
inputs      = ["street2DelayedCBDone", "street2DelayedCBChance"]
value       = "100 * street2DelayedCBDone / street2DelayedCBChance"
aggregate   = "ratio"
format      = "%0.1f"
description = "Bet the turn after checking the flop as the preflop aggressor."

# Turn probe — newly derived in DerivedStats._calc_turn_probe and persisted to
# HandsPlayers (street2Probe*). Populates on re-import.
[[stat]]
name        = "probe_turn"
label       = "Probe Turn"
category    = "Standard / Postflop"
scope       = ["ring", "tour"]
inputs      = ["street2ProbeDone", "street2ProbeChance"]
value       = "100 * street2ProbeDone / street2ProbeChance"
aggregate   = "ratio"
format      = "%0.1f"
description = "Bet the turn (as non-aggressor) after the preflop raiser checked the flop."
